<!doctype html><html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카페 트렌드 — 키워드 관리</title><style>
/* 색: 본문·라벨은 WCAG AA(4.5:1) 를 넘긴 값만 쓴다. 눈으로 고르지 않고 재서 골랐다 — 16장 */

/* ── 1층 원시값 ─────────────────────────────────────────────────
   날것의 값. 거의 안 바뀐다. 색은 따뜻한 모노크롬 한 계열로만 쓴다. */
:root{
 --c-bone:#f7f6f3; --c-white:#ffffff; --c-ink:#14130f; --c-ink-2:#45433c;
 --c-gray:#6e6c64; --c-line:#e6e4dc; --c-rust:#c2410c; --c-rust-wash:#fbeee8;
 --c-pine:#0f7a55; --c-pine-wash:#e8f4ef; --c-slate:#1f62b8;
 --c-ring:rgba(20,19,15,.13); --c-hair:rgba(20,19,15,.07);
 --c-coal:#1f1e1a; --c-chalk:#faf9f6;
 /* 간격 — 4px 기준, 반 칸은 0.5 로 적는다 */
 --s-05:2px; --s-1:4px; --s-15:6px; --s-2:8px; --s-25:10px; --s-3:12px;
 --s-35:14px; --s-4:16px; --s-5:20px; --s-6:24px; --s-7:28px; --s-8:32px;
 --s-10:40px; --s-11:44px; --s-12:48px; --s-14:56px;
 /* 글자 크기 */
 --t-3xs:11px; --t-2xs:12px; --t-xs:13px; --t-sm:14px; --t-md:15px;
 --t-lg:16px; --t-xl:22px; --t-2xl:29px;
 /* 줄 간격 */
 --lh-1:1.2; --lh-2:1.45; --lh-3:1.6;
 /* 모서리 */
 --r-xs:3px; --r-sm:7px; --r-md:9px; --r-lg:12px; --r-full:999px;
 /* 글자 굵기 */
 --w-md:500; --w-sb:600; --w-b:700; --w-xb:800;
 /* 겹침 순서 — 숫자를 그 자리에서 짓지 않는다 */
 --z-pop:20; --z-tip:40;
}

/* ── 2층 뜻 ─────────────────────────────────────────────────────
   "무엇에 쓰는 색인가". 라이트·다크가 갈리는 유일한 층이다. */
:root{color-scheme:light;
 --plane:var(--c-bone); --surface:var(--c-white);
 --ink:var(--c-ink); --ink2:var(--c-ink-2); --mut:var(--c-gray);
 --grid:var(--c-line); --ring:var(--c-ring); --hair:var(--c-hair);
 --up:var(--c-rust); --new:var(--c-pine); --dn:var(--c-gray); --accent:var(--c-slate);
 --upwash:var(--c-rust-wash); --newwash:var(--c-pine-wash);
 --tipbg:var(--c-coal); --tipink:var(--c-chalk);
 --shadow-pop:0 8px 24px rgba(20,19,15,.10)}

/* ── 3층 부품 ───────────────────────────────────────────────────
   부품 하나를 손볼 때 여기만 고친다. 본문 규칙은 이 토큰만 읽는다. */
:root{
 --card-pad:var(--s-4); --card-r:var(--r-lg); --card-gap:var(--s-35);
 --sec-mt:var(--s-11); --sec-mb:var(--s-35); --sec-t:var(--t-xs);
 --fig-v:var(--t-2xl); --fig-l:var(--t-2xs); --fig-gap:var(--s-15);
 --chip-pad:var(--s-1) var(--s-2); --chip-t:var(--t-2xs);
 --note-t:var(--t-2xs); --note-mb:var(--s-3);
 --fold-pad:var(--s-25) var(--s-35); --fold-r:var(--r-md); --fold-t:var(--t-xs);
 /* 단추 — design-system 스킬의 Button 명세표(sm 크기·변형·상태) */
 --btn-h:var(--s-8); --btn-px:var(--s-3); --btn-t:var(--t-sm); --btn-r:var(--r-sm);
 --btn-solid-bg:var(--ink); --btn-solid-fg:var(--plane); --btn-solid-bg-h:var(--ink2);
 --btn-line-fg:var(--ink2); --btn-line-bd:var(--ring);
 --btn-ghost-fg:var(--mut);
 --dur-color:150ms; --dur-move:200ms;
}

@media(prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){color-scheme:dark;
 --plane:#111110; --surface:#1c1c1a;
 --ink:#f2f1ed; --ink2:#c9c7bd; --mut:#9a988f;
 --grid:#2e2e2b; --ring:rgba(255,255,255,.14); --hair:rgba(255,255,255,.07);
 --up:#f0845a; --new:#38c495; --dn:#9a988f; --accent:#6aa8f0;
 --upwash:#2e1d14; --newwash:#12291f; --tipbg:#f2f1ed; --tipink:#1f1e1a}}
*{box-sizing:border-box}
body{margin:0;padding:var(--s-7) var(--s-5) var(--s-14);background:var(--plane);color:var(--ink);
 font:14.5px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
 -webkit-font-smoothing:antialiased}
.page{max-width:1180px;margin:0 auto}
h1{font-size:var(--t-xl);margin:0 0 var(--s-05);letter-spacing:-.02em;font-weight:700}
h2{font-size:var(--t-sm);margin:var(--s-11) 0 var(--s-35);color:var(--ink);font-weight:700;
 display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s-05) var(--s-25);letter-spacing:-.005em}
h2 .t{white-space:nowrap}
h2 .sub{flex:0 1 auto;min-width:0}
h2::after{content:"";flex:1 0 24px;height:1px;background:var(--grid);
 align-self:center;margin-left:var(--s-05)}
h3{font-size:var(--t-xs);margin:0 0 var(--s-3);color:var(--ink2);font-weight:700;
 display:flex;align-items:center;gap:var(--s-15)}
.sub{color:var(--mut);font-size:var(--t-2xs);font-weight:400;letter-spacing:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}

/* 지난 날짜 보기 — day_picker() 가 만든다.
   자주 하는 건 하루 앞뒤로 옮기는 것이라 이동 단추를 앞에, 달력은 접어 둔다.
   칸 크기는 손가락 기준(모바일 44px, Apple HIG)으로 잡는다 */
.days{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);
 margin:var(--s-35) 0 var(--s-05);font-size:var(--t-2xs)}
/* 단추 셋이 똑같이 생겨서 '오늘'이 주 동작인지 안 보였다. 스킬 명세표의
   세 변형을 쓴다 — solid(주 동작) / line(3차) / ghost(보조). 크기는 sm. */
.days .go,.cal>summary{display:inline-flex;align-items:center;gap:var(--s-15);
 min-height:var(--btn-h);padding:0 var(--btn-px);border-radius:var(--btn-r);
 text-decoration:none;cursor:pointer;font-size:var(--btn-t);line-height:1;
 transition:color var(--dur-color) ease-in-out,background-color var(--dur-color) ease-in-out,
 border-color var(--dur-color) ease-in-out}
/* line — 앞뒤 날짜 */
.days .go{border:1px solid var(--btn-line-bd);background:transparent;color:var(--btn-line-fg)}
.days .go:hover{border-color:var(--ink2);color:var(--ink)}
.days .go:active{transform:translateY(1px)}
/* solid — 오늘로 돌아가기. 보관본에서 유일한 출구라 주 동작이다 */
.days .go.home{border-color:var(--btn-solid-bg);background:var(--btn-solid-bg);
 color:var(--btn-solid-fg);font-weight:var(--w-sb)}
.days .go.home:hover{border-color:var(--btn-solid-bg-h);background:var(--btn-solid-bg-h);
 color:var(--btn-solid-fg)}
/* ghost — 달력 펴기 */
.cal>summary{border:1px solid transparent;background:transparent;color:var(--btn-ghost-fg)}
.cal>summary:hover{background:var(--grid);color:var(--ink2)}
.days .go:focus-visible,.cal>summary:focus-visible,.mon .grid a:focus-visible{
 outline:2px solid var(--accent);outline-offset:2px}
.days .ar{color:var(--mut);font-size:var(--t-xs)}
.days .go:hover .ar{color:inherit}
.days .go.home .ar{color:inherit}
.days .now{color:var(--mut);padding:0 var(--s-05)}

/* 달력은 흐름 안에 두면 안 된다. 펼치는 순간 flex 줄이 세로로 커져서
   옆의 '어제' 단추가 그 높이 한가운데로 밀려났다. 띄우는 패널로 바꾼다. */
.cal{display:inline-block;margin:0}
/* 급등한 키워드 — 수준이 낮아도 가장 먼저 눈에 들어와야 한다 */
.card.brk{border-color:var(--up);box-shadow:0 0 0 1px var(--up)}
/* 알약 배지를 쓰지 않는다. 헤더의 분류 태그가 이미 같은 주황 알약이라 둘이
   싸웠고, 폭을 안 잡아 카드 전체를 채우며 두 줄로 접혔다. 평범한 글줄 하나로
   바꾼다 — 카드 테두리가 이미 강조를 맡고 있으니 여기서 또 소리칠 필요가 없다. */
.f .v{font-variant-numeric:tabular-nums}
.f.up .v,.f .v.up{color:var(--up)}
.brk-n{margin:var(--s-05) 0 var(--s-3);color:var(--up);font-size:var(--t-2xs);font-weight:600;
 line-height:1.5;letter-spacing:-.1px;text-wrap:pretty}

/* 한 칸에 카드가 많을 때 — 접어 두되 지우지 않는다 */
.more{margin:var(--s-3) 0 0}
.more>summary{cursor:pointer;font-size:var(--t-xs);color:var(--ink2);padding:var(--s-25) var(--s-35);
 border:1px solid var(--ring);border-radius:var(--r-md);background:var(--surface);
 list-style:none;display:inline-flex;align-items:center;gap:var(--s-15);min-height:var(--s-10)}
.more>summary::-webkit-details-marker{display:none}
.more>summary::before{content:"▸";color:var(--mut);font-size:10px}
.more[open]>summary::before{content:"▾"}
.more>summary:hover{border-color:var(--ink2);color:var(--ink)}
.more>.cards{margin-top:var(--s-3)}
.cal>summary{list-style:none}
.cal>summary::-webkit-details-marker{display:none}
.cal>summary::after{content:"▾";color:var(--mut);font-size:10px}
.cal[open]>summary{color:var(--ink);border-color:var(--ink2)}
.cals{position:absolute;top:calc(100% + var(--s-2));left:0;right:auto;z-index:var(--z-pop);
 display:flex;flex-wrap:wrap;gap:var(--s-5);margin:0;padding:var(--s-35) var(--s-4);
 width:max-content;max-width:min(92vw,520px);
 background:var(--surface);border:1px solid var(--ring);border-radius:var(--r-lg);
 box-shadow:var(--shadow-pop)}
.mon{min-width:224px}
.mon .mh{font-size:var(--t-2xs);font-weight:700;color:var(--ink2);margin-bottom:var(--s-2)}
.mon .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s-1);
 font-variant-numeric:tabular-nums}
.mon .grid i,.mon .grid a,.mon .grid span{display:flex;align-items:center;
 justify-content:center;min-height:var(--s-8);border-radius:var(--r-sm);font-size:var(--t-2xs);
 font-style:normal}
.mon .grid i{color:var(--mut);font-size:10.5px;min-height:var(--s-5)}
.mon .grid a{color:var(--ink);text-decoration:none;background:var(--plane);
 border:1px solid var(--hair);font-weight:650}
.mon .grid a:hover{border-color:var(--accent);color:var(--accent)}
.mon .grid .off{color:var(--mut);opacity:.35}
.mon .grid .now{color:var(--up);font-weight:700;border:1px solid var(--up)}
@media(max-width:560px){
 .cals{padding:var(--s-3) var(--s-25)}
 .mon{min-width:0;flex:1 1 100%}
 .days .go,.cal>summary{min-height:var(--s-11);padding:0 var(--s-4)}   /* 손가락 기준 */
 .mon .grid a,.mon .grid span{min-height:var(--s-11)}
}

/* 오늘 확인할 것 */
.check{background:var(--surface);border:1px solid var(--ring);border-radius:var(--r-lg);
 padding:var(--s-05) var(--s-4);margin:var(--s-6) 0 var(--s-1)}
.check li{list-style:none;padding:var(--s-35) 0;border-top:1px solid var(--hair);
 font-size:var(--t-sm);line-height:1.65;color:var(--ink2);display:flex;gap:var(--s-3);
 align-items:flex-start}
.check li:first-child{border-top:0}
.check b{color:var(--ink)}
.check .ic{flex:0 0 auto;font-size:var(--t-xs);line-height:1.6}
.check ul{margin:0;padding:0}
.check .tx{text-wrap:pretty}

/* 빈 칸. 비었다는 것도 정보다 — 섹션을 통째로 숨기면 ⚡ 만 날마다 들쭉날쭉해
   화면이 흔들린다. 그렇다고 알림 상자를 빈 채로 두면 '담은 게 없는 카드' 라
   더 나쁘다. 면과 테두리를 빼고 실선만 가늘게 남겨 뒤로 물린다.
   아래 여백을 위보다 크게 준다 — 수치로 같게 하면 눈에는 위로 쏠려 보인다.

   이름을 .none 으로 두면 안 된다. 관리 화면(운영.py)이 '결과 없음' 에 먼저
   쓰고 있어서, 이 CSS 를 그대로 깔고 쓰는 그쪽 문단에 테두리와 여백이 새어
   들어갔다. 공용 층에는 흔한 이름을 두지 않는다. */
.sec-empty{border:1px solid var(--hair);border-radius:var(--r-lg);
 padding:var(--s-4) var(--s-4) var(--s-5);margin:var(--s-6) 0 var(--s-1);
 color:var(--mut);font-size:var(--t-sm);line-height:1.65}

/* 카드 — 큰 수치 하나 + 비교 하나 + 그래프 + 밑줄 메타 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--s-35)}
.card{border:1px solid var(--ring);border-radius:var(--r-lg);background:var(--surface);
 padding:var(--s-4) var(--s-4) var(--s-4);min-width:0;display:flex;flex-direction:column}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:var(--s-25)}
.card .nm{font-weight:700;font-size:var(--t-lg);letter-spacing:-.015em;min-width:0;
 display:block;color:var(--ink);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:0}
.card .id{font-size:var(--t-xs);color:var(--mut);margin:var(--s-1) 0 0;line-height:1.5;
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s-15) var(--s-6);margin:var(--s-4) 0 0}
.lead .f{min-width:0}
.lead .v{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.03em;line-height:1;
 display:block;font-variant-numeric:tabular-nums}
.lead .f2 .v{font-size:var(--t-lg);font-weight:650;letter-spacing:-.01em;padding-bottom:var(--s-1)}
.lead .l{font-size:var(--t-2xs);color:var(--mut);margin-top:var(--s-2);display:block;white-space:nowrap}
.lead .f2 .v.up{color:var(--up)}
.lead .f2 .v.dn{color:var(--dn)}

.plot{margin:0;padding:0}
.plots{margin:var(--s-4) 0 0}
.plots .p+.p{margin-top:var(--s-3)}
.plots .pl{font-size:var(--t-2xs);color:var(--mut);margin-bottom:var(--s-1)}
.plots .rail{margin-top:var(--s-2)}
.plots .p+.p svg.area .fill{opacity:0}
.plots .p+.p svg.area .ln{stroke:var(--mut);stroke-width:1.5}
.plots .p+.p svg.area .pt,.plots .p+.p .hot .pk{fill:var(--mut);stroke:var(--surface)}
.rail{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-2);
 font-size:var(--t-3xs);color:var(--mut);margin-top:var(--s-2);font-variant-numeric:tabular-nums}
.rail .mid{color:var(--mut);font-variant-numeric:normal}

.meta{display:flex;flex-wrap:wrap;gap:var(--s-2) var(--s-6);margin:var(--s-35) 0 0;padding:var(--s-3) 0 0;
 border-top:1px solid var(--hair)}
.meta>div{display:flex;align-items:baseline;gap:var(--s-2);min-width:0}
.meta dt{font-size:var(--t-2xs);color:var(--mut);white-space:nowrap}
.meta dd{margin:0;font-size:var(--t-xs);font-weight:650;color:var(--ink2);white-space:nowrap;
 font-variant-numeric:tabular-nums}
.meta dd .q{font-weight:400;color:var(--mut);font-size:var(--t-3xs)}

/* 그래프 — 본체는 흐름만, 정확한 값은 마우스·키보드로 */
svg.area{width:100%;height:auto;display:block;overflow:visible}
svg.area .fill{fill:var(--accent);opacity:.11}
svg.area .ln{fill:none;stroke:var(--accent);stroke-width:2;
 stroke-linejoin:round;stroke-linecap:round}
svg.area .base{stroke:var(--grid);stroke-width:1}
svg.area .avg{stroke:var(--mut);stroke-width:1;stroke-dasharray:3 3;opacity:.5}
svg.area .avgl{fill:var(--mut);font:400 9px/1 system-ui,-apple-system,sans-serif}
svg.area .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2.5}
.hot{outline:none}
.hot .hit{fill:transparent}
.hot .cx,.hot .pk,.hot .tip{pointer-events:none}
.hot .cx{stroke:var(--ink);stroke-width:1;opacity:0}
.hot .pk{fill:var(--accent);stroke:var(--surface);stroke-width:2;opacity:0}
.hot .tip{opacity:0}
.hot .tip rect{fill:var(--tipbg)}
.hot .tip .d{font-weight:400;opacity:.72}
.hot .tip text{fill:var(--tipink);font:600 10px/1 system-ui,-apple-system,sans-serif;
 font-variant-numeric:tabular-nums}
.hot:hover .cx{opacity:.3}
.hot:hover .pk,.hot:hover .tip{opacity:1}
.card.up svg.area .fill{fill:var(--up)}
.card.up svg.area .ln{stroke:var(--up)}
.card.up svg.area .pt,.card.up .hot .pk{fill:var(--up);stroke:var(--surface)}
.card.dn svg.area .fill{fill:var(--dn)}
.card.dn svg.area .ln{stroke:var(--dn)}
.card.dn svg.area .pt,.card.dn .hot .pk{fill:var(--dn);stroke:var(--surface)}
@media(prefers-reduced-motion:no-preference){.hot .tip,.hot .pk,.hot .cx{transition:opacity .08s}}

/* 스파크라인 */
.spark{display:inline-flex;align-items:flex-end;gap:var(--s-05);height:15px;margin-left:var(--s-2);
 vertical-align:-3px}
.spark i{width:3px;background:var(--mut);opacity:.4;display:block;border-radius:var(--r-xs)}
.spark i.now{opacity:1}
.up .spark i.now{background:var(--up)}
.new .spark i.now{background:var(--new)}
.dn .spark i.now{background:var(--dn)}

/* 표 */
.wrap{border:1px solid var(--ring);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.scroll{max-height:480px;overflow:auto}
.xscroll{overflow-x:auto}
.xscroll table{min-width:700px}
table{width:100%;border-collapse:collapse;font-size:var(--t-xs)}
th{text-align:left;background:var(--surface);padding:var(--s-3) var(--s-35);font-weight:600;
 font-size:var(--t-2xs);color:var(--mut);position:sticky;top:0;white-space:nowrap;
 border-bottom:1px solid var(--grid)}
td{padding:var(--s-3) var(--s-35);border-top:1px solid var(--hair);vertical-align:middle}
tbody tr:first-child td{border-top:0}
tbody tr:hover{background:var(--plane)}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink2)}
td.b{white-space:nowrap;font-weight:650}
td.c{white-space:nowrap;color:var(--mut);font-size:var(--t-xs);font-variant-numeric:tabular-nums}
td.d{white-space:nowrap;color:var(--mut);font-size:var(--t-xs);font-variant-numeric:tabular-nums}
td.m{color:var(--ink2)}
td.m a{color:inherit;text-decoration:none}
td.m a:hover{text-decoration:underline}
.rank{color:var(--mut);font-variant-numeric:tabular-nums;width:1%}
.cap{color:var(--mut);font-size:var(--t-2xs);margin:var(--s-25) var(--s-05) 0;line-height:1.6}

/* 후보 낱말 — 가운뎃점으로 이어 붙이면 어디서 끊기는지 안 보인다 */
.terms{display:flex;flex-wrap:wrap;gap:var(--s-15)}

/* 컴포넌트 토큰. 의미 층에 대응이 없는 '레이아웃 치수' 만 여기서 이름을 준다.
   간격·글자·라운드는 전부 공용 눈금(--s-* --t-* --r-*)을 쓴다 — 11.5px 처럼
   눈금 밖 값을 --ops-* 로 감싸면 하드코딩을 이름만 바꿔 옮기는 것이다. */
:root{
 --ops-step-min:132px;  /* 진행 단계 한 칸이 접히기 전 최소 폭 */
 --ops-tile-min:128px;   /* 통계 타일이 접히기 전 최소 폭 */
 --ops-find-min:230px;   /* 검색창이 칩과 한 줄에 설 최소 폭 */
 --ops-thead-top:60px;   /* 붙어 있는 검색줄 높이만큼 표 머리를 내린다 */
 --ops-sort-hit:28px;    /* 마우스에서 정렬 단추 높이. 손가락은 --s-11 */
}

/* 진행 단계. 바로 아래 '수집한 글' 이 이미 타일 다섯 장이라, 여기까지 상자로
   만들면 화면이 타일 두 줄로 시작한다. 선 하나로 가볍게 끊는다.
   색은 실패에만 쓴다 — 성공이 기본값이라 색을 줄 이유가 없다.
   표시·이름이 칸마다 같은 높이에 서야 한다(align-items:flex-start). */
.flow{display:flex;flex-wrap:wrap;gap:var(--s-25);margin:var(--s-3) 0 0;
 padding:0;list-style:none}
.flow .s{flex:1 1 var(--ops-step-min);display:flex;gap:var(--s-25);
 align-items:flex-start;border:1px solid var(--ring);border-radius:var(--r-lg);
 background:var(--surface);padding:var(--s-3) var(--s-35)}
/* 아직 안 한 칸은 면을 비우고 테두리를 점선으로. 다 한 칸과 한눈에 갈린다 */
.flow .wait{background:none;border-style:dashed;border-color:var(--hair)}
.flow .bad{border-color:var(--up);background:var(--upwash)}
.flow .m{flex:0 0 auto;width:var(--s-5);height:var(--s-5);
 border:1px solid var(--hair);border-radius:var(--r-full);
 display:inline-flex;align-items:center;justify-content:center;
 font-size:var(--t-3xs);line-height:1;color:var(--mut)}
.flow .n{display:block;font-size:var(--t-xs);line-height:1.45;color:var(--ink2);
 word-break:keep-all}
.flow .ok .m{border-color:var(--ink);color:var(--ink)}
.flow .ok .n{color:var(--ink)}
.flow .bad .m{border-color:var(--up);background:var(--plane);color:var(--up)}
.flow .bad .n{color:var(--up);font-weight:600}
.flow .wait .m,.flow .wait .n{color:var(--mut)}
.flow .why{display:block;color:var(--up);font-size:var(--t-3xs);
 margin-top:var(--s-1);
 font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
.runwhen{margin:var(--s-1) 0 0;color:var(--mut);font-size:var(--t-3xs)}
/* 눈에는 안 보이고 스크린리더만 읽는다. ✓ 는 aria-hidden 이라 이게 없으면
   성공인지 실패인지 소리로 알 길이 없다. */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;
 clip-path:inset(50%);white-space:nowrap}

.ops{display:flex;flex-wrap:wrap;gap:var(--s-25);margin:var(--s-3) 0 0}
.ops .box{flex:1 1 var(--ops-tile-min);background:var(--surface);
 border:1px solid var(--ring);border-radius:var(--r-lg);
 padding:var(--s-3) var(--s-35)}
.ops .box .k{color:var(--mut);font-size:var(--t-3xs)}
.ops .box .v{font-size:var(--t-xl);font-weight:700;letter-spacing:-.02em;
 margin-top:var(--s-05)}
.ops .box.zero .v{color:var(--mut)}
.ops .box .dl{color:var(--mut);font-size:var(--t-3xs);margin-top:var(--s-1)}
.ops .box .dl.down{color:var(--up)}
/* 한 화면에 큰 숫자는 하나. 합계는 채널 타일과 나란히 두지 않는다 */
.hero{margin:var(--s-35) 0 0;font-size:var(--t-md);color:var(--ink2)}
.hero b{font-size:var(--t-2xl);font-weight:700;letter-spacing:-.025em;
 color:var(--ink);margin-right:var(--s-1);vertical-align:-2px}
.run{margin:var(--s-3) 0 0;padding:var(--s-3) var(--s-35);background:var(--surface);
 border:1px solid var(--ring);border-radius:var(--r-lg);font-size:var(--t-xs)}
.run.bad{border-color:var(--up);background:var(--upwash)}
.run.bad>b{color:var(--up)}
.run.none{color:var(--mut)}
.run ul{margin:var(--s-2) 0 0;padding:0;list-style:none}
.run li{padding:var(--s-15) 0 0;border-top:1px solid var(--hair);
 margin-top:var(--s-15);font-size:var(--t-xs)}
.run li b{margin-right:var(--s-15)}
.run .why{display:block;color:var(--ink2);font-size:var(--t-3xs);
 margin-top:var(--s-1);
 font-family:ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}
.findbar{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center;
 margin:var(--s-35) 0 var(--s-25);
 position:sticky;top:0;z-index:5;background:var(--plane);padding:var(--s-2) 0}
.findbar input{flex:1 1 var(--ops-find-min);min-height:var(--s-11);
 padding:0 var(--s-35);font:inherit;
 background:var(--surface);color:var(--ink);border:1px solid var(--ring);
 border-radius:var(--r-md)}
.findbar input::placeholder{color:var(--mut)}
.chip{min-height:var(--s-11);padding:0 var(--s-35);border:1px solid var(--ring);
 border-radius:var(--r-full);
 background:var(--surface);color:var(--ink2);font:inherit;font-size:var(--t-2xs);
 cursor:pointer;display:inline-flex;align-items:center;gap:var(--s-15)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--plane);border-color:var(--ink)}
.chip .c{opacity:.65;font-variant-numeric:tabular-nums}
.cnt{color:var(--mut);font-size:var(--t-2xs);margin-left:auto;white-space:nowrap;
 font-variant-numeric:tabular-nums;align-self:center}
/* overflow:hidden 을 쓰면 안 된다. overflow 가 visible 이 아닌 조상은 sticky 의
   기준 상자가 돼서, 표 머리가 화면 위가 아니라 표 안쪽 60px 에 붙는다 — 그 자리가
   첫 줄 위라 줄을 덮는다(2026-11-04 실측: thead 280, 1번 줄 266~321).
   모서리는 네 귀퉁이 셀에서 직접 둥글린다. */
table.ws{width:100%;border-collapse:separate;border-spacing:0;
 font-size:var(--t-xs);
 background:var(--surface);border:1px solid var(--ring);border-radius:var(--r-lg)}
table.ws thead th:first-child{border-top-left-radius:var(--r-lg)}
table.ws thead th:last-child{border-top-right-radius:var(--r-lg)}
table.ws tbody tr:last-child td:first-child{border-bottom-left-radius:var(--r-lg)}
table.ws tbody tr:last-child td:last-child{border-bottom-right-radius:var(--r-lg)}
table.ws th,table.ws td{text-align:left;padding:var(--s-2) var(--s-3);
 border-bottom:1px solid var(--hair);vertical-align:top}
table.ws thead th{position:sticky;top:var(--ops-thead-top);background:var(--surface);
 color:var(--mut);
 font-size:var(--t-3xs);font-weight:600;white-space:nowrap;z-index:4;
 border-bottom:1px solid var(--grid)}
table.ws thead th button{all:unset;cursor:pointer;display:inline-flex;gap:var(--s-1);
 min-height:var(--ops-sort-hit);align-items:center}
table.ws thead th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
table.ws thead th .so{color:var(--accent);font-size:var(--t-3xs)}
/* 손가락으로 누르는 기기에서만 44px 로 키운다(Apple HIG). 마우스에서까지
   키우면 표 머리가 쓸데없이 두꺼워진다 */
@media(pointer:coarse){table.ws thead th button{min-height:var(--s-11)}}
table.ws thead th[aria-sort="none"] .so{content:none}
table.ws thead th:not([aria-sort="none"]){color:var(--ink)}
table.ws tbody tr:last-child td{border-bottom:0}
table.ws tbody tr:hover{background:var(--hair)}
td.w{font-weight:700;white-space:nowrap}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.ev{color:var(--ink2);line-height:1.45}
td.ev .why{display:block;color:var(--mut);font-size:var(--t-3xs);margin-top:var(--s-1)}
.st{display:inline-block;padding:1px var(--s-2);border-radius:var(--r-full);
 font-size:var(--t-3xs);
 border:1px solid var(--ring);white-space:nowrap}
.st.등록{background:var(--ink);color:var(--plane);border-color:var(--ink);font-weight:700}
.st.측정{color:var(--accent);border-color:var(--accent)}
.st.후보{color:var(--ink2);border-color:var(--ring)}
.st.제외{color:var(--mut);border-color:transparent;padding-left:0}
.none{padding:var(--s-6) var(--s-35);text-align:center;color:var(--mut);
 font-size:var(--t-xs)}
/* 중단점은 var() 를 못 쓴다 — @media 는 커스텀 속성을 안 읽는다 */
@media(max-width:620px){
 /* 칩이 두세 줄로 접히는데 그걸 고정하면 화면 절반을 먹고 첫 카드를 덮는다 */
 .findbar{position:static}
 table.ws thead{position:absolute;left:-9999px}
 table.ws tbody tr{display:block;padding:var(--s-25) var(--s-3);
  border-bottom:1px solid var(--hair)}
 table.ws td{display:block;border:0;padding:1px 0}
 table.ws td.num::before{content:attr(data-k) " ";color:var(--mut);
  font-size:var(--t-3xs)}
 .findbar input{flex:1 1 100%}}
</style>

  +'<td class="num" data-k="확인일">'+(r.on||'·')+'</td></tr>';
}
function draw(){
 const v=R.filter(pass).sort((a,b)=>{
  // 기본 줄 세우기는 상태 순서(등록→후보→제외), 같으면 검색량 큰 것부터
  if(key==='r'&&a.r!==b.r)return a.r-b.r;
  if(key==='r'){const x=a.d===null?-1:a.d,y=b.d===null?-1:b.d;return y-x}
  let x=a[key],y=b[key];
  if(TXT[key]){x=x||'';y=y||'';return asc?(x<y?-1:x>y?1:0):(x>y?-1:x<y?1:0)}
  x=(x===null?-1:x);y=(y===null?-1:y);return asc?x-y:y-x;});
 tb.innerHTML=v.map(cell).join('');
 // 칩이 이미 그 수를 들고 있다. 검색어를 쳤을 때만 값이 달라지므로
 // 그때만 띄운다 — 아니면 같은 숫자를 두 번 쓰게 된다(2026-11-04 지시).
 cnt.textContent=q.value.trim()?v.length.toLocaleString()+'개':'';
 // 어느 칸으로 어느 방향인지 보여 준다. 안 보이면 누른 효과를 읽을 수 없다.
 // 다만 처음 열었을 때는 안 띄운다 — 누르지도 않은 기준에 화살표가 떠 있으면
 // 그게 뭔지 묻게 된다. 설명 줄을 뺐으니 더 그렇다(2026-11-04 지시).
 document.querySelectorAll('th[data-k]').forEach(h=>{
  const on=sorted&&h.dataset.k===key;
  h.setAttribute('aria-sort',on?(asc?'ascending':'descending'):'none');
  h.querySelector('.so').textContent=on?(asc?' ▲':' ▼'):'';});
 // 빈 화면은 막다른 길이면 안 된다 — 어디서 찾으면 되는지 말해 준다
 none.hidden=v.length>0;
 if(!v.length){
  const t=q.value.trim();
  none.textContent=t?(t+" 은(는) "+scope+" 안에 없어요. 전체를 눌러 보세요.")
                   :(scope+" 에 해당하는 키워드가 없어요.");}
}
q.addEventListener('input',draw);
chips.forEach(c=>c.addEventListener('click',()=>{
 scope=c.dataset.s;chips.forEach(o=>o.setAttribute('aria-pressed',o===c));draw();}));
document.querySelectorAll('th button').forEach(b=>b.addEventListener('click',()=>{
 const k=b.dataset.k;asc=(k===key)?!asc:!!TXT[k];key=k;sorted=true;draw();}));
draw();
</script>
